spring.application.name=market-data-service
server.port=8081

# Loads ALPACA_KEY and ALPACA_SECRET from the project-root .env file
spring.config.import=optional:file:../../.env[.properties]

# alpaca = real prices, simulated = generated prices for testing
market-data.provider=${MARKET_DATA_PROVIDER:alpaca}
market-data.symbols=AAPL,MSFT,GOOGL,AMZN,META,NVDA,TSLA,AMD,NFLX,AVGO,ORCL,CRM,ADBE,INTC,CSCO,QCOM,IBM,PYPL,UBER,SHOP,JPM,BAC,V,MA,WMT
market-data.tick-interval-ms=1000

alpaca.key=${ALPACA_KEY:}
alpaca.secret=${ALPACA_SECRET:}
alpaca.feed=iex

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
