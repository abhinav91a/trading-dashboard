spring.application.name=portfolio-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
spring.datasource.username=trader
spring.datasource.password=trader

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=portfolio-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.tradingdashboard.portfolio.prices.PriceTick
spring.kafka.consumer.properties.spring.json.use.type.headers=false