spring.application.name=watchlist-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/watchlist_db
spring.datasource.username=trader
spring.datasource.password=trader

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cached symbol lists expire after 10 minutes, even without an explicit eviction
spring.cache.type=redis
spring.cache.redis.time-to-live=10m