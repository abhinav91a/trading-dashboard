spring.application.name=auth-service
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=trader
spring.datasource.password=trader

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Shared with the other services in Step 8.2. Set JWT_SECRET in your shell
# before starting the app; the value must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60
